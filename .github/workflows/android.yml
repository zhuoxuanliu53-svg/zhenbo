name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Execute the checked-in Gradle 9.3.1 wrapper; do not substitute a newer Gradle.
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Verify bundled OCR assets
        run: python3 tools/verify_ocr_assets.py

      - name: Test, lint and build
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain
          testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
        # Release output remains unsigned. Publishing and release keys stay outside CI.
